<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Business Bulk Shipment - RIDEEL</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#e0e3e5",
                        "secondary": "#5c5f61",
                        "on-primary-container": "#799dd6",
                        "secondary-fixed": "#e0e3e5",
                        "inverse-on-surface": "#eaf1ff",
                        "outline-variant": "#c3c6d1",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-container": "#00b27b",
                        "on-secondary-fixed-variant": "#444749",
                        "on-secondary-container": "#626567",
                        "tertiary-fixed-dim": "#4edea3",
                        "surface-tint": "#3a5f94",
                        "error-container": "#ffdad6",
                        "background": "#f8f9ff",
                        "primary-fixed": "#d5e3ff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#dce9ff",
                        "surface-container-low": "#eff4ff",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#002416",
                        "surface-variant": "#d3e4fe",
                        "on-background": "#0b1c30",
                        "surface-container": "#e5eeff",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-dim": "#cbdbf5",
                        "surface-container-highest": "#d3e4fe",
                        "outline": "#737780",
                        "on-surface-variant": "#43474f",
                        "secondary-fixed-dim": "#c4c7c9",
                        "primary": "#001e40",
                        "primary-container": "#003366",
                        "on-primary-fixed": "#001b3c",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-surface": "#0b1c30",
                        "on-primary-fixed-variant": "#1f477b",
                        "inverse-surface": "#213145",
                        "on-secondary": "#ffffff",
                        "surface": "#f8f9ff",
                        "on-secondary-fixed": "#191c1e",
                        "on-tertiary-fixed": "#002113",
                        "tertiary-container": "#003c27",
                        "primary-fixed-dim": "#a7c8ff",
                        "inverse-primary": "#a7c8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "gutter": "16px",
                        "container-padding-mobile": "20px",
                        "stack-sm": "12px",
                        "stack-lg": "40px",
                        "container-padding-desktop": "40px",
                        "stack-md": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Public Sans"],
                        "headline-md": ["Public Sans"],
                        "label-caps": ["Public Sans"],
                        "price-display": ["Public Sans"],
                        "body-lg": ["Public Sans"],
                        "body-md": ["Public Sans"],
                        "headline-lg": ["Public Sans"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "price-display": ["18px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; background-color: #F8FAFC; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #E2E8F0; }
        .soft-shadow { box-shadow: 0px 4px 20px rgba(0, 51, 102, 0.08); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface antialiased flex flex-col min-h-screen">
<!-- TopAppBar (Transactional - Hidden shell layout logic applied via suppression, but requested as standalone screen, showing simplified header) -->
<header class="bg-surface-container-lowest border-b border-outline-variant fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding-mobile h-16 soft-shadow">
<button class="text-primary hover:bg-surface-container transition-colors rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Create Bulk Shipment</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<main class="flex-grow pt-[88px] pb-safe px-container-padding-mobile md:px-container-padding-desktop max-w-[1200px] mx-auto w-full flex flex-col gap-stack-md md:flex-row md:items-start md:gap-stack-lg">
<!-- Form Section -->
<section class="w-full md:w-1/2 flex flex-col gap-stack-md">
<div class="glass-panel rounded-xl p-stack-sm soft-shadow flex flex-col gap-stack-sm relative overflow-hidden group">
<div class="absolute -right-10 -top-10 w-40 h-40 bg-primary-fixed-dim rounded-full blur-3xl opacity-20 group-hover:opacity-40 transition-opacity"></div>
<h2 class="font-headline-md text-headline-md text-primary mb-2">Shipment Details</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-sm">
<!-- Pickup City -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Pickup City</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">location_on</span>
<input class="w-full pl-10 pr-3 py-3 rounded-lg border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container font-body-md text-body-md outline-none transition-all" placeholder="e.g. Mumbai" type="text"/>
</div>
</div>
<!-- Destination City -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Destination City</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">pin_drop</span>
<input class="w-full pl-10 pr-3 py-3 rounded-lg border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container font-body-md text-body-md outline-none transition-all" placeholder="e.g. Delhi" type="text"/>
</div>
</div>
<!-- Number of Parcels -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Number of Parcels</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">inventory_2</span>
<input class="w-full pl-10 pr-3 py-3 rounded-lg border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container font-body-md text-body-md outline-none transition-all" min="1" placeholder="0" type="number"/>
</div>
</div>
<!-- Total Estimated Weight -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Total Est. Weight (kg)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">scale</span>
<input class="w-full pl-10 pr-3 py-3 rounded-lg border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container font-body-md text-body-md outline-none transition-all" min="0.1" placeholder="0.0" step="0.1" type="number"/>
</div>
</div>
</div>
<!-- Preferred Pickup Date -->
<div class="flex flex-col gap-1 mt-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Preferred Pickup Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">calendar_today</span>
<input class="w-full pl-10 pr-3 py-3 rounded-lg border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container font-body-md text-body-md outline-none transition-all text-on-surface" type="date"/>
</div>
</div>
</div>
</section>
<!-- Added Parcels Section -->
<section class="w-full md:w-1/2 flex flex-col gap-stack-md">
<div class="glass-panel rounded-xl p-stack-sm soft-shadow flex flex-col h-full">
<div class="flex justify-between items-center mb-4">
<h2 class="font-headline-md text-headline-md text-primary">Added Parcels</h2>
<button class="flex items-center gap-1 text-primary-container hover:text-primary font-label-caps text-label-caps transition-colors">
<span class="material-symbols-outlined" style="font-size: 16px;">add_circle</span> ADD PARCEL
                    </button>
</div>
<!-- Empty State (Hidden in this demo, shown to illustrate structure) -->
<!-- <div class="flex-grow flex flex-col items-center justify-center py-10 text-center opacity-50">
                    <span class="material-symbols-outlined text-4xl mb-2">package_2</span>
                    <p class="font-body-md text-body-md">No parcels added yet.</p>
                </div> -->
<!-- List State -->
<div class="flex-grow flex flex-col gap-3 overflow-y-auto hide-scrollbar max-h-[350px]">
<!-- Parcel Item 1 -->
<div class="bg-surface-bright border border-outline-variant rounded-lg p-3 flex justify-between items-center hover:border-primary-container transition-colors group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined">laptop_mac</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-[16px] text-on-surface leading-tight">Electronics Bundle</span>
<span class="font-body-md text-body-md text-on-surface-variant text-[12px]">5kg • High Value</span>
</div>
</div>
<button class="text-outline hover:text-error transition-colors p-1 rounded-full group-hover:bg-error-container">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Parcel Item 2 -->
<div class="bg-surface-bright border border-outline-variant rounded-lg p-3 flex justify-between items-center hover:border-primary-container transition-colors group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined">description</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-[16px] text-on-surface leading-tight">Legal Documents</span>
<span class="font-body-md text-body-md text-on-surface-variant text-[12px]">0.5kg • Standard</span>
</div>
</div>
<button class="text-outline hover:text-error transition-colors p-1 rounded-full group-hover:bg-error-container">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<!-- Summary & Action -->
<div class="mt-4 pt-4 border-t border-outline-variant flex flex-col gap-4">
<div class="flex justify-between items-center font-body-md text-body-md">
<span class="text-on-surface-variant">Estimated Cost</span>
<span class="font-price-display text-price-display text-primary">₹2,450</span>
</div>
<button class="w-full bg-primary-container text-on-primary font-headline-md text-[16px] py-4 rounded-[12px] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-md">
                        Create Shipments
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</section>
</main>
</body></html>
