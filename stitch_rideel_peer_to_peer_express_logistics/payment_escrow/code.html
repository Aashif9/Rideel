<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Secure Payment &amp; Escrow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-highest": "#d3e4fe",
                    "on-primary-fixed": "#001b3c",
                    "error-container": "#ffdad6",
                    "outline": "#737780",
                    "outline-variant": "#c3c6d1",
                    "primary": "#001e40",
                    "on-primary-container": "#799dd6",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "tertiary": "#002416",
                    "tertiary-fixed-dim": "#4edea3",
                    "surface": "#f8f9ff",
                    "on-secondary-fixed-variant": "#444749",
                    "on-tertiary-fixed": "#002113",
                    "on-tertiary-fixed-variant": "#005236",
                    "surface-dim": "#cbdbf5",
                    "on-surface-variant": "#43474f",
                    "surface-container": "#e5eeff",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed-variant": "#1f477b",
                    "primary-fixed": "#d5e3ff",
                    "secondary-fixed": "#e0e3e5",
                    "background": "#f8f9ff",
                    "tertiary-container": "#003c27",
                    "surface-variant": "#d3e4fe",
                    "primary-container": "#003366",
                    "on-surface": "#0b1c30",
                    "inverse-on-surface": "#eaf1ff",
                    "secondary": "#5c5f61",
                    "inverse-primary": "#a7c8ff",
                    "on-secondary-container": "#626567",
                    "on-primary": "#ffffff",
                    "secondary-container": "#e0e3e5",
                    "secondary-fixed-dim": "#c4c7c9",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#a7c8ff",
                    "error": "#ba1a1a",
                    "surface-bright": "#f8f9ff",
                    "surface-container-high": "#dce9ff",
                    "on-error": "#ffffff",
                    "tertiary-fixed": "#6ffbbe",
                    "surface-tint": "#3a5f94",
                    "on-background": "#0b1c30",
                    "surface-container-low": "#eff4ff",
                    "inverse-surface": "#213145",
                    "on-tertiary-container": "#00b27b",
                    "on-secondary-fixed": "#191c1e"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-lg": "40px",
                    "container-padding-desktop": "40px",
                    "gutter": "16px",
                    "container-padding-mobile": "20px",
                    "base": "8px",
                    "stack-md": "24px",
                    "stack-sm": "12px"
            },
            "fontFamily": {
                    "headline-md": ["Public Sans"],
                    "body-lg": ["Public Sans"],
                    "headline-lg": ["Public Sans"],
                    "body-md": ["Public Sans"],
                    "headline-lg-mobile": ["Public Sans"],
                    "price-display": ["Public Sans"],
                    "label-caps": ["Public Sans"]
            },
            "fontSize": {
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "price-display": ["18px", {"lineHeight": "24px", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary">
<div class="min-h-screen flex flex-col max-w-[1200px] mx-auto bg-surface md:border-x md:border-outline-variant/30 relative">
<!-- Top Navigation Bar (Transactional/Custom) -->
<header class="flex justify-between items-center px-container-padding-mobile h-16 border-b border-outline-variant bg-surface sticky top-0 z-50 pt-safe">
<div class="flex items-center gap-3">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-highest transition-colors text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Pay securely</h1>
</div>
<div class="w-10 h-10"></div> <!-- Spacer to center title visually if needed, though flex-between handles it -->
</header>
<!-- Main Scrollable Content -->
<main class="flex-1 overflow-y-auto px-container-padding-mobile py-stack-md flex flex-col gap-stack-md pb-40">
<!-- Amount Display -->
<section class="flex flex-col items-center justify-center py-stack-sm">
<span class="font-body-md text-body-md text-on-surface-variant uppercase tracking-wider">Total Amount</span>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-primary mt-1">₹145</div>
</section>
<!-- Escrow Explanation Card -->
<section class="bg-surface-container rounded-xl p-stack-sm flex items-start gap-4 border border-outline-variant/50 shadow-sm relative overflow-hidden">
<div class="absolute -right-4 -top-4 w-24 h-24 bg-primary-container/5 rounded-full blur-xl pointer-events-none"></div>
<div class="flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-primary-container" data-icon="security" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<p class="font-body-md text-body-md text-on-surface pr-2 z-10">
                    Your payment is held securely and released to the traveler only after successful delivery.
                </p>
</section>
<!-- Payment Options -->
<section class="flex flex-col gap-3 mt-2">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Payment Options</h2>
<!-- UPI Option -->
<label class="flex items-center p-stack-sm bg-surface rounded-xl border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors shadow-sm relative group">
<input checked="" class="form-radio text-primary-container focus:ring-primary-container w-5 h-5 mr-4 border-outline-variant" name="payment_method" type="radio"/>
<div class="flex-1 flex items-center justify-between">
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-medium group-hover:text-primary-container transition-colors">UPI</span>
<span class="font-body-md text-body-md text-on-surface-variant">PhonePe, Google Pay</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors" data-icon="qr_code_scanner">qr_code_scanner</span>
</div>
</label>
<!-- Card Option -->
<label class="flex items-center p-stack-sm bg-surface rounded-xl border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors shadow-sm relative group">
<input class="form-radio text-primary-container focus:ring-primary-container w-5 h-5 mr-4 border-outline-variant" name="payment_method" type="radio"/>
<div class="flex-1 flex items-center justify-between">
<span class="font-body-lg text-body-lg text-on-surface font-medium group-hover:text-primary-container transition-colors">Credit/Debit Card</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors" data-icon="credit_card">credit_card</span>
</div>
</label>
<!-- Net Banking Option -->
<label class="flex items-center p-stack-sm bg-surface rounded-xl border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors shadow-sm relative group">
<input class="form-radio text-primary-container focus:ring-primary-container w-5 h-5 mr-4 border-outline-variant" name="payment_method" type="radio"/>
<div class="flex-1 flex items-center justify-between">
<span class="font-body-lg text-body-lg text-on-surface font-medium group-hover:text-primary-container transition-colors">Net Banking</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors" data-icon="account_balance">account_balance</span>
</div>
</label>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<footer class="fixed bottom-0 left-0 w-full md:max-w-[1200px] md:left-1/2 md:-translate-x-1/2 bg-surface-container-lowest border-t border-outline-variant px-container-padding-mobile py-stack-sm flex flex-col gap-4 z-50 pb-safe shadow-[0_-4px_20px_rgba(0,51,102,0.08)]">
<!-- Trust Badges -->
<div class="flex justify-center items-center gap-6 text-secondary">
<div class="flex items-center gap-1.5 opacity-80">
<span class="material-symbols-outlined text-[16px]" data-icon="lock">lock</span>
<span class="font-label-caps text-label-caps">Secure payment</span>
</div>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<div class="flex items-center gap-1.5 opacity-80">
<span class="material-symbols-outlined text-[16px]" data-icon="enhanced_encryption">enhanced_encryption</span>
<span class="font-label-caps text-label-caps">Encrypted transaction</span>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary-container text-on-primary py-4 rounded-xl font-body-lg text-body-lg font-semibold shadow-[0_4px_20px_rgba(0,51,102,0.08)] hover:shadow-[0_2px_10px_rgba(0,51,102,0.12)] active:shadow-none active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Pay ₹145</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</div>
</body></html>
