<style>
        body { font-family: 'Public Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
        /* Smooth transition for view swap */
        .view-transition { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease; }
        .view-hidden { transform: translateX(100%); opacity: 0; pointer-events: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .view-active { transform: translateX(0); opacity: 1; pointer-events: auto; position: relative; }
        
        /* OTP Input hiding default arrows */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>

<body class="bg-background min-h-screen flex items-center justify-center p-4">
<!-- Mobile App Container -->
<main class="w-full max-w-[400px] h-[800px] max-h-[90vh] bg-surface-container-lowest border border-outline-variant/30 rounded-[32px] shadow-2xl relative overflow-hidden flex flex-col">
<!-- Top Branding / Decor -->
<div class="h-48 w-full bg-surface-container relative overflow-hidden flex-shrink-0">
<div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#003366 1px, transparent 1px); background-size: 20px 20px;"></div>
<div class="absolute bottom-0 left-0 w-full h-24 bg-gradient-to-t from-surface-container-lowest to-transparent"></div>
<div class="absolute top-8 left-container-padding-mobile flex items-center gap-2">
<div class="w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[24px]">local_shipping</span>
</div>
<span class="font-headline-md text-headline-md text-primary tracking-tight">RIDEEL</span>
</div>
</div>
<div class="flex-1 relative">
<!-- View 1: Mobile Number Input -->
<div class="view-transition view-active h-full flex flex-col px-container-padding-mobile pb-8" id="view-mobile">
<div class="mt-stack-md flex-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Welcome to Rideel</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Enter your mobile number to securely log in or create a new account.</p>
<div class="space-y-6">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase tracking-wider">Mobile Number</label>
<div class="flex items-center w-full bg-surface border border-outline-variant rounded-lg overflow-hidden focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<div class="px-4 py-4 bg-surface-variant/30 border-r border-outline-variant flex items-center gap-2 text-on-surface font-body-lg text-body-lg">
<span class="material-symbols-outlined text-[20px] text-primary">public</span>
<span>+91</span>
</div>
<input autocomplete="tel" class="flex-1 px-4 py-4 bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder-outline" id="mobile-input" placeholder="Enter mobile number" type="tel"/>
</div>
</div>
</div>
</div>
<div class="flex flex-col gap-stack-sm mt-auto pt-stack-md">
<button class="w-full bg-primary-container text-on-primary py-4 rounded-btn font-headline-md text-headline-md hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-primary-container/20 flex items-center justify-center gap-2" id="btn-continue">
<span>Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="text-center font-body-md text-body-md text-on-surface-variant text-[12px] px-4">
                        By continuing, you agree to Rideel's <a class="text-primary underline underline-offset-2" href="#">Terms</a> &amp; <a class="text-primary underline underline-offset-2" href="#">Privacy Policy</a>.
                    </p>
</div>
</div>
<!-- View 2: OTP Verification -->
<div class="view-transition view-hidden h-full flex flex-col px-container-padding-mobile pb-8 bg-surface-container-lowest z-10" id="view-otp">
<button class="absolute top-0 left-container-padding-mobile w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant text-on-surface transition-colors mt-2" id="btn-back">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="mt-stack-lg pt-8 flex-1">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Verify it's you</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">
                        We've sent a 6-digit code to <span class="font-semibold text-primary">+91 ••••• ••384</span>
</p>
<!-- 6 Digit OTP Input -->
<div class="flex justify-between gap-2 mb-stack-lg" id="otp-container">
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg text-primary border border-outline-variant rounded-lg bg-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all shadow-sm outline-none" maxlength="1" type="number"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg text-primary border border-outline-variant rounded-lg bg-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all shadow-sm outline-none" maxlength="1" type="number"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg text-primary border border-outline-variant rounded-lg bg-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all shadow-sm outline-none" maxlength="1" type="number"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg text-primary border border-outline-variant rounded-lg bg-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all shadow-sm outline-none" maxlength="1" type="number"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg text-primary border border-outline-variant rounded-lg bg-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all shadow-sm outline-none" maxlength="1" type="number"/>
<input class="w-12 h-14 text-center font-headline-lg text-headline-lg text-primary border border-outline-variant rounded-lg bg-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all shadow-sm outline-none" maxlength="1" type="number"/>
</div>
<div class="flex flex-col items-center gap-4">
<div class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">timer</span>
<span>00:45</span>
</div>
<button class="font-headline-md text-headline-md text-primary hover:text-primary-container transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            Resend OTP
                        </button>
</div>
</div>
<div class="mt-auto pt-stack-md">
<button class="w-full bg-primary-container text-on-primary py-4 rounded-btn font-headline-md text-headline-md hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-primary-container/20 flex items-center justify-center gap-2">
<span>Verify &amp; Proceed</span>
<span class="material-symbols-outlined text-[20px]">check_circle</span>
</button>
</div>
</div>
</div>
</main>
<script>
        // Simple Interaction Logic for prototyping
        document.addEventListener('DOMContentLoaded', () => {
            const viewMobile = document.getElementById('view-mobile');
            const viewOtp = document.getElementById('view-otp');
            const btnContinue = document.getElementById('btn-continue');
            const btnBack = document.getElementById('btn-back');
            const otpInputs = document.querySelectorAll('#otp-container input');

            btnContinue.addEventListener('click', () => {
                viewMobile.classList.remove('view-active');
                viewMobile.classList.add('view-hidden');
                
                // Add slight delay before showing OTP to allow out-animation
                setTimeout(() => {
                    viewOtp.classList.remove('view-hidden');
                    viewOtp.classList.add('view-active');
                    if(otpInputs.length > 0) otpInputs[0].focus();
                }, 50);
            });

            btnBack.addEventListener('click', () => {
                viewOtp.classList.remove('view-active');
                viewOtp.classList.add('view-hidden');
                
                setTimeout(() => {
                    viewMobile.classList.remove('view-hidden');
                    viewMobile.classList.add('view-active');
                }, 50);
            });

            // OTP Input Logic
            otpInputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    if (e.target.value !== '' && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                });
            });
        });
    </script>
</body></html>
