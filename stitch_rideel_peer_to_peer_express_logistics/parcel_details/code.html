<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Parcel Details Form</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-highest": "#d3e4fe",
                      "on-primary-fixed": "#001b3c",
                      "error-container": "#ffdad6",
                      "outline": "#737780",
                      "outline-variant": "#c3c6d1",
                      "primary": "#001e40",
                      "on-primary-container": "#799dd6",
                      "on-secondary": "#ffffff",
                      "on-error-container": "#93000a",
                      "tertiary": "#002416",
                      "tertiary-fixed-dim": "#4edea3",
                      "surface": "#f8f9ff",
                      "on-secondary-fixed-variant": "#444749",
                      "on-tertiary-fixed": "#002113",
                      "on-tertiary-fixed-variant": "#005236",
                      "surface-dim": "#cbdbf5",
                      "on-surface-variant": "#43474f",
                      "surface-container": "#e5eeff",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#1f477b",
                      "primary-fixed": "#d5e3ff",
                      "secondary-fixed": "#e0e3e5",
                      "background": "#f8f9ff",
                      "tertiary-container": "#003c27",
                      "surface-variant": "#d3e4fe",
                      "primary-container": "#003366",
                      "on-surface": "#0b1c30",
                      "inverse-on-surface": "#eaf1ff",
                      "secondary": "#5c5f61",
                      "inverse-primary": "#a7c8ff",
                      "on-secondary-container": "#626567",
                      "on-primary": "#ffffff",
                      "secondary-container": "#e0e3e5",
                      "secondary-fixed-dim": "#c4c7c9",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed-dim": "#a7c8ff",
                      "error": "#ba1a1a",
                      "surface-bright": "#f8f9ff",
                      "surface-container-high": "#dce9ff",
                      "on-error": "#ffffff",
                      "tertiary-fixed": "#6ffbbe",
                      "surface-tint": "#3a5f94",
                      "on-background": "#0b1c30",
                      "surface-container-low": "#eff4ff",
                      "inverse-surface": "#213145",
                      "on-tertiary-container": "#00b27b",
                      "on-secondary-fixed": "#191c1e"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-lg": "40px",
                      "container-padding-desktop": "40px",
                      "gutter": "16px",
                      "container-padding-mobile": "20px",
                      "base": "8px",
                      "stack-md": "24px",
                      "stack-sm": "12px"
              },
              "fontFamily": {
                      "headline-md": ["Public Sans"],
                      "body-lg": ["Public Sans"],
                      "headline-lg": ["Public Sans"],
                      "body-md": ["Public Sans"],
                      "headline-lg-mobile": ["Public Sans"],
                      "price-display": ["Public Sans"],
                      "label-caps": ["Public Sans"]
              },
              "fontSize": {
                      "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                      "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                      "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                      "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                      "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                      "price-display": ["18px", { "lineHeight": "24px", "fontWeight": "700" }],
                      "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
              }
            }
          }
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .ambient-shadow {
            box-shadow: 0px 4px 20px rgba(0, 51, 102, 0.08);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-md">
<!-- Header / Task Navigation -->
<header class="fixed top-0 left-0 w-full z-50 bg-background/90 backdrop-blur-md flex items-center px-container-padding-mobile h-16 pt-safe">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container transition-colors -ml-2">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex-1"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[1200px] mx-auto px-container-padding-mobile pt-[88px] pb-[120px] md:px-container-padding-desktop">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-lg md:font-headline-lg md:text-headline-lg">
            Tell us about your parcel
        </h1>
<!-- Parcel Type Selection -->
<section class="mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Parcel Type</h2>
<div class="grid grid-cols-3 gap-3 md:gap-gutter">
<!-- Document -->
<button class="flex flex-col items-center justify-center bg-surface border border-outline-variant rounded-xl p-4 transition-all hover:bg-surface-container active:bg-surface-container-highest">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">description</span>
</div>
<span class="font-body-md text-body-md text-on-surface text-center">Document</span>
</button>
<!-- Small Package (Active State Example) -->
<button class="flex flex-col items-center justify-center bg-surface border-2 border-primary rounded-xl p-4 transition-all ambient-shadow relative overflow-hidden">
<div class="absolute top-2 right-2 w-4 h-4 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[10px] text-on-primary">check</span>
</div>
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">package_2</span>
</div>
<span class="font-headline-md text-[14px] text-primary text-center">Small</span>
</button>
<!-- Medium Package -->
<button class="flex flex-col items-center justify-center bg-surface border border-outline-variant rounded-xl p-4 transition-all hover:bg-surface-container active:bg-surface-container-highest">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
</div>
<span class="font-body-md text-body-md text-on-surface text-center">Medium</span>
</button>
</div>
</section>
<!-- Dimensions and Weight -->
<section class="mb-stack-lg grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Weight Input -->
<div class="flex flex-col">
<label class="font-headline-md text-[16px] text-on-surface mb-2" for="weight">Weight</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface border border-outline-variant rounded-lg px-4 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="weight" placeholder="0.0" type="number"/>
<span class="absolute right-4 font-body-md text-body-md text-outline">kg</span>
</div>
</div>
<!-- Dimensions -->
<div class="flex flex-col">
<label class="font-headline-md text-[16px] text-on-surface mb-2">Dimensions <span class="font-body-md text-outline font-normal">(Optional)</span></label>
<div class="flex gap-2">
<div class="relative flex-1">
<input class="w-full h-14 bg-surface border border-outline-variant rounded-lg px-3 text-center font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="L" type="number"/>
</div>
<div class="flex items-center text-outline-variant"><span class="material-symbols-outlined text-sm">close</span></div>
<div class="relative flex-1">
<input class="w-full h-14 bg-surface border border-outline-variant rounded-lg px-3 text-center font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="W" type="number"/>
</div>
<div class="flex items-center text-outline-variant"><span class="material-symbols-outlined text-sm">close</span></div>
<div class="relative flex-1">
<input class="w-full h-14 bg-surface border border-outline-variant rounded-lg px-3 text-center font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="H" type="number"/>
</div>
<div class="flex items-center ml-1 text-outline font-body-md">cm</div>
</div>
</div>
</section>
<!-- Description -->
<section class="mb-stack-lg flex flex-col">
<label class="font-headline-md text-[16px] text-on-surface mb-2" for="description">What are you sending?</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg p-4 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all resize-none" id="description" placeholder="E.g., A stack of legal documents and a small notebook." rows="3"></textarea>
</section>
<!-- Image Upload -->
<section class="mb-stack-lg">
<h2 class="font-headline-md text-[16px] text-on-surface mb-2">Upload parcel photo</h2>
<div class="w-full h-32 bg-surface-container border-2 border-dashed border-outline-variant rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container-high transition-colors group">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary">add_a_photo</span>
</div>
<span class="font-body-md text-body-md text-primary">Tap to upload</span>
</div>
</section>
<!-- Safety Notice -->
<section class="flex items-start bg-surface-container-low p-4 rounded-xl border border-surface-container-high">
<span class="material-symbols-outlined text-primary mr-3 mt-0.5">info</span>
<p class="font-body-md text-body-md text-on-surface-variant flex-1">
                Restricted items are not allowed. Please ensure your parcel complies with our <a class="text-primary font-bold underline" href="#">safety guidelines</a> before proceeding.
            </p>
</section>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant p-container-padding-mobile pb-safe z-50">
<div class="max-w-[1200px] mx-auto">
<button class="w-full h-14 bg-primary-container text-on-primary rounded-[12px] font-headline-md text-[16px] flex items-center justify-center transition-all hover:opacity-90 active:scale-[0.98] ambient-shadow">
                Continue
            </button>
</div>
</div>
</body></html>
