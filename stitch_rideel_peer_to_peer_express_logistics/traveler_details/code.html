<button class="text-primary dark:text-primary-fixed hover:bg-surface-container dark:hover:bg-surface-container-highest transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed tracking-tight">Traveler</h1>
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant">

</div>

<div class="w-24 h-24 rounded-full border-4 border-surface-container-lowest overflow-hidden mt-4 relative shadow-sm">
<img class="w-full h-full object-cover" data-alt="A high-quality, professional headshot of a young Indian man named Rahul Kumar. He is wearing a smart-casual button-down shirt, smiling confidently. The lighting is soft and flattering, set against a clean, minimalist background to convey reliability and trust." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCF-MWCMXZ7ZRjgU_LLjA94ROFWuxUoSvICq-jTJPNV-nyP4TAYsTD4CYB9nGUvjJmIvy30aw5sujLZT1FVKHEJ6P-7DtnpipbXbmYNnrRy9z7YZ8rqBatBHvOyWcVscXGx_H4ZK0aDzNJanKpjzho-PmET-UPzHvKAtgkdIlhtt6Gwvdb8FQiIQ-ULuLdxloINHA3v3ztqBeL4fRnD4mTQjiutwPedj_Mgd2DbbMmTGkySp-6itmpJ"/>
</div>
<div class="mt-4 flex flex-col items-center">
<h2 class="font-headline-md text-headline-md text-on-surface">Rahul Kumar</h2>
<div class="flex items-center gap-1 mt-1 bg-surface-container-high text-primary px-3 py-1 rounded-full border border-primary-fixed">
<span class="material-symbols-outlined text-[16px] fill-icon">verified</span>
<span class="font-body-md text-body-md font-semibold">Identity verified</span>
</div>
</div>
<div class="flex items-center gap-4 mt-6 w-full justify-center text-on-surface-variant">
<div class="flex flex-col items-center">
<div class="flex items-center gap-1 text-on-surface">
<span class="material-symbols-outlined text-primary-container fill-icon">star</span>
<span class="font-headline-md text-headline-md">4.8</span>
</div>
<span class="font-body-md text-body-md">127 deliveries</span>
</div>
<div class="w-px h-8 bg-outline-variant"></div>
<div class="flex flex-col items-center">
<div class="flex items-center gap-1 text-on-surface">
<span class="material-symbols-outlined text-primary-container">calendar_today</span>
<span class="font-headline-md text-headline-md">Jan '23</span>
</div>
<span class="font-body-md text-body-md">Joined</span>
</div>
</div>
</section>
<!-- Vehicle Info -->

</div>

<div class="flex justify-between items-start">
<div>

</div>
<span class="font-price-display text-price-display text-primary">2:30 PM</span>
</div>
</div>
<!-- Destination -->

<div class="absolute -left-6 top-1 w-3 h-3 rounded-full bg-primary-container border-2 border-surface-container-lowest z-10"></div>

</div>
</div>
</div>

            Request Delivery
        </button>
</div>
