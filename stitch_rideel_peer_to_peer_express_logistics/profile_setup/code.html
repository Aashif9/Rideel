<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile Setup - Rideel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-highest": "#d3e4fe",
                      "on-primary-fixed": "#001b3c",
                      "error-container": "#ffdad6",
                      "outline": "#737780",
                      "outline-variant": "#c3c6d1",
                      "primary": "#001e40",
                      "on-primary-container": "#799dd6",
                      "on-secondary": "#ffffff",
                      "on-error-container": "#93000a",
                      "tertiary": "#002416",
                      "tertiary-fixed-dim": "#4edea3",
                      "surface": "#f8f9ff",
                      "on-secondary-fixed-variant": "#444749",
                      "on-tertiary-fixed": "#002113",
                      "on-tertiary-fixed-variant": "#005236",
                      "surface-dim": "#cbdbf5",
                      "on-surface-variant": "#43474f",
                      "surface-container": "#e5eeff",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#1f477b",
                      "primary-fixed": "#d5e3ff",
                      "secondary-fixed": "#e0e3e5",
                      "background": "#f8f9ff",
                      "tertiary-container": "#003c27",
                      "surface-variant": "#d3e4fe",
                      "primary-container": "#003366",
                      "on-surface": "#0b1c30",
                      "inverse-on-surface": "#eaf1ff",
                      "secondary": "#5c5f61",
                      "inverse-primary": "#a7c8ff",
                      "on-secondary-container": "#626567",
                      "on-primary": "#ffffff",
                      "secondary-container": "#e0e3e5",
                      "secondary-fixed-dim": "#c4c7c9",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed-dim": "#a7c8ff",
                      "error": "#ba1a1a",
                      "surface-bright": "#f8f9ff",
                      "surface-container-high": "#dce9ff",
                      "on-error": "#ffffff",
                      "tertiary-fixed": "#6ffbbe",
                      "surface-tint": "#3a5f94",
                      "on-background": "#0b1c30",
                      "surface-container-low": "#eff4ff",
                      "inverse-surface": "#213145",
                      "on-tertiary-container": "#00b27b",
                      "on-secondary-fixed": "#191c1e"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-lg": "40px",
                      "container-padding-desktop": "40px",
                      "gutter": "16px",
                      "container-padding-mobile": "20px",
                      "base": "8px",
                      "stack-md": "24px",
                      "stack-sm": "12px"
              },
              "fontFamily": {
                      "headline-md": ["Public Sans"],
                      "body-lg": ["Public Sans"],
                      "headline-lg": ["Public Sans"],
                      "body-md": ["Public Sans"],
                      "headline-lg-mobile": ["Public Sans"],
                      "price-display": ["Public Sans"],
                      "label-caps": ["Public Sans"]
              },
              "fontSize": {
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-lg": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "price-display": ["18px", {"lineHeight": "24px", "fontWeight": "700"}],
                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        /* Custom Checkbox for Cards */
        .role-card input:checked + div {
            background-color: theme('colors.primary-container');
            border-color: theme('colors.primary');
        }
        .role-card input:checked + div .role-icon,
        .role-card input:checked + div .role-title {
            color: theme('colors.on-primary-container');
        }
        .role-card input:checked + div .check-circle {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen antialiased flex flex-col md:items-center md:justify-center">
<!-- Onboarding specific wrapper: Suppressed Navigations -->
<main class="w-full max-w-[600px] flex flex-col min-h-screen md:min-h-[800px] md:shadow-2xl md:rounded-3xl md:overflow-hidden bg-background relative">
<!-- Header Section -->
<header class="px-container-padding-mobile pt-stack-lg pb-stack-md flex flex-col items-center text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Let's set up your profile</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Complete your details to start using Rideel.</p>
</header>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-container-padding-mobile pb-stack-lg flex flex-col gap-stack-md">
<!-- Profile Photo Upload -->
<div class="flex justify-center">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full bg-surface-container-highest flex items-center justify-center border-2 border-dashed border-outline-variant overflow-hidden">
<span class="material-symbols-outlined text-4xl text-outline group-hover:text-primary transition-colors">add_a_photo</span>
</div>
<!-- Hidden file input for actual functionality -->
<input accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file"/>
</div>
</div>
<!-- Form Inputs -->
<div class="flex flex-col gap-stack-sm">
<!-- Full Name -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-lg text-body-lg text-on-surface placeholder:text-outline transition-all" id="fullName" placeholder="e.g. Rohan Sharma" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-lg text-body-lg text-on-surface placeholder:text-outline transition-all" id="email" placeholder="rohan@example.com" type="email"/>
</div>
</div>
<!-- City -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1" for="city">City</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">location_city</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-lg text-body-lg text-on-surface placeholder:text-outline transition-all" id="city" placeholder="e.g. Mumbai" type="text"/>
</div>
</div>
</div>
<!-- Role Selection Section -->
<div class="flex flex-col gap-stack-sm pt-stack-sm">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">How will you use Rideel?</h2>
<p class="font-body-md text-body-md text-on-surface-variant -mt-2 mb-2">Select all that apply.</p>
<div class="grid grid-cols-2 gap-gutter">
<!-- Card 1: Send Parcels -->
<label class="role-card cursor-pointer relative">
<input class="peer sr-only" type="checkbox" value="sender"/>
<div class="h-32 rounded-2xl bg-surface border-2 border-outline-variant flex flex-col items-center justify-center gap-3 transition-all duration-200 hover:shadow-lg">
<span class="material-symbols-outlined text-4xl text-on-surface-variant role-icon transition-colors">package_2</span>
<span class="font-headline-md text-headline-md text-on-surface text-center px-2 role-title transition-colors text-[16px] leading-[22px]">Send Parcels</span>
<!-- Check indicator -->
<div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-primary flex items-center justify-center opacity-0 scale-50 transition-all duration-200 check-circle">
<span class="material-symbols-outlined text-on-primary text-[16px] icon-filled">check</span>
</div>
</div>
</label>
<!-- Card 2: Travel & Earn -->
<label class="role-card cursor-pointer relative">
<input class="peer sr-only" type="checkbox" value="traveler"/>
<div class="h-32 rounded-2xl bg-surface border-2 border-outline-variant flex flex-col items-center justify-center gap-3 transition-all duration-200 hover:shadow-lg">
<span class="material-symbols-outlined text-4xl text-on-surface-variant role-icon transition-colors">directions_car</span>
<span class="font-headline-md text-headline-md text-on-surface text-center px-2 role-title transition-colors text-[16px] leading-[22px]">Travel &amp; Earn</span>
<!-- Check indicator -->
<div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-primary flex items-center justify-center opacity-0 scale-50 transition-all duration-200 check-circle">
<span class="material-symbols-outlined text-on-primary text-[16px] icon-filled">check</span>
</div>
</div>
</label>
</div>
</div>
<!-- Spacer to push button if content is short -->
<div class="flex-1 min-h-[40px]"></div>
</div>
<!-- Sticky Bottom Button Action Area -->
<div class="p-container-padding-mobile bg-background pb-safe border-t border-outline-variant md:border-none md:pb-stack-lg">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-md text-headline-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center shadow-[0_4px_20px_rgba(0,51,102,0.15)]">
                Continue
            </button>
</div>
</main>
</body></html>
