<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('carousel-container');
            const dots = document.getElementById('pagination-dots').children;
            
            const updateDots = () => {
                const scrollLeft = container.scrollLeft;
                const slideWidth = container.clientWidth;
                
                let activeIndex = Math.round(scrollLeft / slideWidth);
                
                if (activeIndex < 0) activeIndex = 0;
                if (activeIndex > 2) activeIndex = 2;

                Array.from(dots).forEach((dot, index) => {
                    if (index === activeIndex) {
                        dot.className = 'h-2 w-6 rounded-full bg-primary dot-transition';
                    } else {
                        dot.className = 'h-2 w-2 rounded-full bg-outline-variant dot-transition';
                    }
                });
            };

            container.addEventListener('scroll', updateDots, { passive: true });
        });
    </script>
