<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const completeBtn = document.getElementById('complete-btn');
            const successOverlay = document.getElementById('success-overlay');
            const successCard = document.getElementById('success-card');

            // Auto-focus logic for OTP inputs
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            input.blur(); // Remove focus on last input
                        }
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });

            // Simulate Completion
            completeBtn.addEventListener('click', () => {
                // In a real app, validate OTP and Photo here
                completeBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Verifying...';
                
                setTimeout(() => {
                    successOverlay.style.display = 'flex';
                    successCard.style.display = 'block';
                }, 800);
            });
        });
    </script>
