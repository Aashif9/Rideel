<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Personal Information</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#e0e3e5",
                        "secondary": "#5c5f61",
                        "on-primary-container": "#799dd6",
                        "secondary-fixed": "#e0e3e5",
                        "inverse-on-surface": "#eaf1ff",
                        "outline-variant": "#c3c6d1",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-container": "#00b27b",
                        "on-secondary-fixed-variant": "#444749",
                        "on-secondary-container": "#626567",
                        "tertiary-fixed-dim": "#4edea3",
                        "surface-tint": "#3a5f94",
                        "error-container": "#ffdad6",
                        "background": "#f8f9ff",
                        "primary-fixed": "#d5e3ff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#dce9ff",
                        "surface-container-low": "#eff4ff",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#002416",
                        "surface-variant": "#d3e4fe",
                        "on-background": "#0b1c30",
                        "surface-container": "#e5eeff",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-dim": "#cbdbf5",
                        "surface-container-highest": "#d3e4fe",
                        "outline": "#737780",
                        "on-surface-variant": "#43474f",
                        "secondary-fixed-dim": "#c4c7c9",
                        "primary": "#001e40",
                        "primary-container": "#003366",
                        "on-primary-fixed": "#001b3c",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-surface": "#0b1c30",
                        "on-primary-fixed-variant": "#1f477b",
                        "inverse-surface": "#213145",
                        "on-secondary": "#ffffff",
                        "surface": "#f8f9ff",
                        "on-secondary-fixed": "#191c1e",
                        "on-tertiary-fixed": "#002113",
                        "tertiary-container": "#003c27",
                        "primary-fixed-dim": "#a7c8ff",
                        "inverse-primary": "#a7c8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "gutter": "16px",
                        "container-padding-mobile": "20px",
                        "stack-sm": "12px",
                        "stack-lg": "40px",
                        "container-padding-desktop": "40px",
                        "stack-md": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Public Sans"],
                        "headline-md": ["Public Sans"],
                        "label-caps": ["Public Sans"],
                        "price-display": ["Public Sans"],
                        "body-lg": ["Public Sans"],
                        "body-md": ["Public Sans"],
                        "headline-lg": ["Public Sans"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "price-display": ["18px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen pb-safe">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding-mobile h-16 bg-surface border-b border-outline-variant flat no shadows">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container transition-colors text-on-surface-variant active:opacity-80 duration-100">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Personal Information</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<main class="pt-[88px] px-container-padding-mobile pb-[104px] max-w-md mx-auto">
<!-- Profile Photo Section -->
<div class="flex flex-col items-center mb-stack-md">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full overflow-hidden border-2 border-primary-container relative">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a young Indian man with a neat beard, wearing a casual solid blue shirt, well-lit with soft natural light, against a clean light grey studio background, modern and clean aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwuILhRouvgFsMsiwYGOBvYVjIvMOPTBrZ0k91zw5RdFmtAKOuUhvVADDY7s4IUqZrcYrAi15rsmsoK8g0nXK9YkYzpuMb042wuTRFf7F9fC3hL46i1z8NR7f1FpFnilxx6EugkYHlTUyCojJ4HaHjQAys73XquSXPMgWcOygAl5VfW_x4OE5V_oKO93O3fPtU--JQLMDVFY6y7i47Z4FShIBSdb5eoG6aTc2cbzZWApWVAcyX_iFX"/>
<div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded-full">
<span class="material-symbols-outlined text-white" data-icon="edit">edit</span>
</div>
</div>
<button class="absolute bottom-0 right-0 bg-primary-container text-white p-1.5 rounded-full border-2 border-surface flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[16px]" data-icon="photo_camera">photo_camera</span>
</button>
</div>
<p class="mt-stack-sm text-primary font-body-md cursor-pointer hover:underline">Change Photo</p>
</div>
<!-- Form Fields -->
<form class="space-y-stack-sm bg-surface-container-lowest p-container-padding-mobile rounded-[24px] border border-outline-variant shadow-[0px_4px_20px_rgba(0,51,102,0.04)]">
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1 ml-1 uppercase" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-10 pr-4 py-3 rounded-xl border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-lg text-body-lg text-on-surface placeholder-secondary" id="fullName" type="text" value="Aashif Shaik"/>
</div>
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1 ml-1 uppercase" for="phone">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="phone_iphone">phone_iphone</span>
<input class="w-full pl-10 pr-4 py-3 rounded-xl border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-lg text-body-lg text-on-surface placeholder-secondary" id="phone" type="tel" value="+91 98765 43210"/>
</div>
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1 ml-1 uppercase" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 rounded-xl border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-lg text-body-lg text-on-surface placeholder-secondary" id="email" type="email" value="aashif@example.com"/>
</div>
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1 ml-1 uppercase" for="city">City</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="location_city">location_city</span>
<input class="w-full pl-10 pr-4 py-3 rounded-xl border border-outline-variant bg-surface-bright focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-lg text-body-lg text-on-surface placeholder-secondary" id="city" type="text" value="Hyderabad"/>
</div>
</div>
</form>
<!-- Save Button -->
<div class="mt-stack-lg">
<button class="w-full bg-primary-container text-white py-4 rounded-[12px] font-headline-md text-headline-md shadow-[0px_4px_20px_rgba(0,51,102,0.15)] hover:bg-primary transition-all active:scale-[0.98] active:shadow-md flex items-center justify-center gap-2" type="button">
                Save Changes
                <span class="material-symbols-outlined text-[20px]" data-icon="check_circle">check_circle</span>
</button>
</div>
</main>
</body></html>
