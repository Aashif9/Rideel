<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>RIDEEL - Splash Screen</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#d3e4fe",
                        "on-primary-fixed": "#001b3c",
                        "error-container": "#ffdad6",
                        "outline": "#737780",
                        "outline-variant": "#c3c6d1",
                        "primary": "#001e40",
                        "on-primary-container": "#799dd6",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary": "#002416",
                        "tertiary-fixed-dim": "#4edea3",
                        "surface": "#f8f9ff",
                        "on-secondary-fixed-variant": "#444749",
                        "on-tertiary-fixed": "#002113",
                        "on-tertiary-fixed-variant": "#005236",
                        "surface-dim": "#cbdbf5",
                        "on-surface-variant": "#43474f",
                        "surface-container": "#e5eeff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#1f477b",
                        "primary-fixed": "#d5e3ff",
                        "secondary-fixed": "#e0e3e5",
                        "background": "#f8f9ff",
                        "tertiary-container": "#003c27",
                        "surface-variant": "#d3e4fe",
                        "primary-container": "#003366",
                        "on-surface": "#0b1c30",
                        "inverse-on-surface": "#eaf1ff",
                        "secondary": "#5c5f61",
                        "inverse-primary": "#a7c8ff",
                        "on-secondary-container": "#626567",
                        "on-primary": "#ffffff",
                        "secondary-container": "#e0e3e5",
                        "secondary-fixed-dim": "#c4c7c9",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#a7c8ff",
                        "error": "#ba1a1a",
                        "surface-bright": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-tint": "#3a5f94",
                        "on-background": "#0b1c30",
                        "surface-container-low": "#eff4ff",
                        "inverse-surface": "#213145",
                        "on-tertiary-container": "#00b27b",
                        "on-secondary-fixed": "#191c1e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "40px",
                        "container-padding-desktop": "40px",
                        "gutter": "16px",
                        "container-padding-mobile": "20px",
                        "base": "8px",
                        "stack-md": "24px",
                        "stack-sm": "12px"
                    },
                    "fontFamily": {
                        "headline-md": ["Public Sans"],
                        "body-lg": ["Public Sans"],
                        "headline-lg": ["Public Sans"],
                        "body-md": ["Public Sans"],
                        "headline-lg-mobile": ["Public Sans"],
                        "price-display": ["Public Sans"],
                        "label-caps": ["Public Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "price-display": ["18px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Keyframes for smooth entrance */
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in-scale {
            animation: fadeInScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .animate-slide-up-fade {
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
            opacity: 0;
        }
    </style>
</head>
<body class="bg-primary-container m-0 p-0 overflow-hidden min-h-screen w-full flex flex-col items-center justify-between relative selection:bg-surface-variant">
<!-- Ambient Background Elements (Subtle depth) -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-20%] left-[-10%] w-[70vw] h-[70vw] rounded-full bg-primary opacity-20 blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-20%] w-[60vw] h-[60vw] rounded-full bg-surface-tint opacity-10 blur-[80px]"></div>
</div>
<!-- Top Spacing -->
<div class="flex-1"></div>
<!-- Central Content Area -->
<main class="z-10 flex flex-col items-center justify-center w-full px-container-padding-mobile max-w-sm mx-auto text-center">
<!-- Logo Element -->
<div class="animate-fade-in-scale flex flex-col items-center justify-center mb-stack-md">
<!-- Geometric Logo Mark representing a box and a route -->
<div class="w-20 h-20 mb-6 relative flex items-center justify-center bg-on-primary rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.2)]">
<span class="material-symbols-outlined text-primary-container !text-5xl" style="font-variation-settings: 'FILL' 1;">
                    local_shipping
                </span>
</div>
<!-- Brand Name -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-primary tracking-wide">
                RIDEEL
            </h1>
</div>
<!-- Tagline -->
<p class="animate-slide-up-fade font-body-lg text-body-lg text-inverse-primary/80 max-w-[280px]">
            Your route. Their parcel. Same day.
        </p>
</main>
<!-- Bottom Loading Indicator -->
<div class="z-10 flex-1 flex flex-col justify-end items-center pb-12 w-full animate-slide-up-fade" style="animation-delay: 0.8s;">
<div class="relative flex justify-center items-center">
<!-- Spinner -->
<svg class="animate-spin h-8 w-8 text-inverse-primary" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</div>
<!-- Optional Loading Text -->
<span class="mt-4 font-label-caps text-label-caps text-inverse-primary/60 uppercase tracking-widest">
            Initializing Secure Network
        </span>
</div>
<!-- Semantic Shell Logic Note: 
         Navigation (TopAppBar, BottomNavBar) is explicitly suppressed here per the
         "Automatic Suppression" rule for transactional/splash screens. -->
</body></html>
