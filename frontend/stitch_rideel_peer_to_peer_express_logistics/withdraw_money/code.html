<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Withdraw Earnings - Rideel</title>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<!-- Tailwind Config from Brand Anchors -->
<script id="tailwind-config">

          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-container": "#e0e3e5",
                      "secondary": "#5c5f61",
                      "on-primary-container": "#799dd6",
                      "secondary-fixed": "#e0e3e5",
                      "inverse-on-surface": "#eaf1ff",
                      "outline-variant": "#c3c6d1",
                      "surface-bright": "#f8f9ff",
                      "on-tertiary-container": "#00b27b",
                      "on-secondary-fixed-variant": "#444749",
                      "on-secondary-container": "#626567",
                      "tertiary-fixed-dim": "#4edea3",
                      "surface-tint": "#3a5f94",
                      "error-container": "#ffdad6",
                      "background": "#f8f9ff",
                      "primary-fixed": "#d5e3ff",
                      "surface-container-lowest": "#ffffff",
                      "on-primary": "#ffffff",
                      "surface-container-high": "#dce9ff",
                      "surface-container-low": "#eff4ff",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#002416",
                      "surface-variant": "#d3e4fe",
                      "on-background": "#0b1c30",
                      "surface-container": "#e5eeff",
                      "on-error": "#ffffff",
                      "tertiary-fixed": "#6ffbbe",
                      "surface-dim": "#cbdbf5",
                      "surface-container-highest": "#d3e4fe",
                      "outline": "#737780",
                      "on-surface-variant": "#43474f",
                      "secondary-fixed-dim": "#c4c7c9",
                      "primary": "#001e40",
                      "primary-container": "#003366",
                      "on-primary-fixed": "#001b3c",
                      "on-error-container": "#93000a",
                      "error": "#ba1a1a",
                      "on-tertiary-fixed-variant": "#005236",
                      "on-surface": "#0b1c30",
                      "on-primary-fixed-variant": "#1f477b",
                      "inverse-surface": "#213145",
                      "on-secondary": "#ffffff",
                      "surface": "#f8f9ff",
                      "on-secondary-fixed": "#191c1e",
                      "on-tertiary-fixed": "#002113",
                      "tertiary-container": "#003c27",
                      "primary-fixed-dim": "#a7c8ff",
                      "inverse-primary": "#a7c8ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px",
                      "2xl": "1.5rem"
              },
              "spacing": {
                      "base": "8px",
                      "gutter": "16px",
                      "container-padding-mobile": "20px",
                      "stack-sm": "12px",
                      "stack-lg": "40px",
                      "container-padding-desktop": "40px",
                      "stack-md": "24px",
                      "safe": "env(safe-area-inset-bottom)"
              },
              "fontFamily": {
                      "headline-lg-mobile": ["Public Sans"],
                      "headline-md": ["Public Sans"],
                      "label-caps": ["Public Sans"],
                      "price-display": ["Public Sans"],
                      "body-lg": ["Public Sans"],

              "fontSize": {

                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

              "boxShadow": {
                "soft": "0px 4px 20px rgba(0, 51, 102, 0.08)"

          }

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Hide number input spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        
        .toast-enter {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col pt-16 pb-[100px]">
<!-- TopAppBar (Transactional - Nav Shell Logic Suppresses Navigation Icons) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding-mobile h-16 bg-surface border-b border-outline-variant flat no shadows">
<button class="text-primary p-2 -ml-2 rounded-full hover:bg-surface-container transition-colors" onclick="history.back()">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary flex-1 text-center">Withdraw Earnings</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[600px] mx-auto px-container-padding-mobile py-stack-md flex flex-col gap-stack-lg relative z-10">
<!-- Balance Header -->
<section class="flex flex-col items-center justify-center text-center">
<span class="font-body-md text-body-md text-on-surface-variant mb-2">Available Balance</span>
<h2 class="text-[36px] leading-[44px] font-bold text-primary">₹2,840</h2>
</section>
<!-- Input Section -->
<section class="bg-surface-container-lowest rounded-2xl p-stack-sm border border-outline-variant shadow-soft flex flex-col items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant w-full text-left mb-2" for="amount">WITHDRAWAL AMOUNT</label>
<div class="flex items-center justify-center w-full border-b-2 border-outline-variant pb-2 focus-within:border-primary transition-colors">
<span class="text-[36px] font-bold text-primary mr-1">₹</span>
<input class="w-full text-[36px] font-bold text-primary bg-transparent border-none p-0 focus:ring-0 text-center" id="amount" placeholder="0" type="number" value="2000"/>
</div>
<div class="flex justify-between w-full mt-4">
<button class="bg-surface-container text-primary font-label-caps text-label-caps px-4 py-2 rounded-full hover:bg-surface-variant transition-colors" onclick="document.getElementById('amount').value = 500">₹500</button>
<button class="bg-surface-container text-primary font-label-caps text-label-caps px-4 py-2 rounded-full hover:bg-surface-variant transition-colors" onclick="document.getElementById('amount').value = 1000">₹1000</button>
<button class="bg-surface-container text-primary font-label-caps text-label-caps px-4 py-2 rounded-full hover:bg-surface-variant transition-colors" onclick="document.getElementById('amount').value = 2840">Max</button>
</div>
</section>
<!-- Bank Account Selection -->
<section class="flex flex-col gap-stack-sm">
<h3 class="font-headline-md text-headline-md text-primary">Select Bank Account</h3>
<!-- Selected Bank Card -->
<label class="bg-surface-container-lowest border border-primary rounded-xl p-4 flex items-center justify-between cursor-pointer shadow-soft relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-surface-container rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<div>
<p class="font-body-lg text-body-lg font-semibold text-on-surface">HDFC Bank</p>
<p class="font-body-md text-body-md text-on-surface-variant">•••• •••• •••• 4589</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-3 h-3 bg-primary rounded-full"></div>
</div>
</label>
<!-- Add New Account Button -->
<button class="bg-surface border border-dashed border-outline-variant rounded-xl p-4 flex items-center justify-center gap-2 hover:bg-surface-container transition-colors text-primary">
<span class="material-symbols-outlined">add</span>
<span class="font-body-md text-body-md font-semibold">Add New Bank Account</span>
</button>
</section>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-container-padding-mobile bg-surface-container-lowest border-t border-outline-variant z-40 pb-safe">
<button class="w-full bg-primary-container text-on-primary font-body-lg text-body-lg font-semibold py-4 rounded-xl shadow-soft active:scale-[0.98] transition-transform" id="withdrawBtn">
            Withdraw
        </button>
</div>
<!-- Success Toast Overlay (Hidden by default) -->
<div class="fixed inset-0 z-[100] flex items-end justify-center px-4 pb-8 pointer-events-none hidden bg-on-background/20 backdrop-blur-sm" id="successOverlay">
<div class="bg-surface-container-lowest border border-tertiary rounded-xl shadow-2xl p-4 flex items-start gap-4 max-w-[400px] w-full toast-enter pointer-events-auto">
<div class="w-10 h-10 bg-tertiary-container rounded-full flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-tertiary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="flex-1 pt-1">
<h4 class="font-headline-md text-headline-md text-tertiary-container mb-1">Withdrawal Successful!</h4>
<p class="font-body-md text-body-md text-on-surface-variant">₹2,000 sent to your bank account.</p>
</div>
<button class="text-on-surface-variant p-1 -mt-1 hover:bg-surface-container rounded-full transition-colors" id="closeToastBtn">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const withdrawBtn = document.getElementById('withdrawBtn');
            const successOverlay = document.getElementById('successOverlay');
            const closeToastBtn = document.getElementById('closeToastBtn');
            
            withdrawBtn.addEventListener('click', () => {
                // Simulate processing
                withdrawBtn.innerHTML = '<span class="material-symbols-outlined animate-spin inline-block">progress_activity</span> Processing...';
                withdrawBtn.classList.add('opacity-80');
                
                setTimeout(() => {
                    withdrawBtn.innerHTML = 'Withdraw';
                    withdrawBtn.classList.remove('opacity-80');
                    successOverlay.classList.remove('hidden');
                    
                    // Auto hide after 5 seconds
                    setTimeout(() => {
                        successOverlay.classList.add('hidden');
                    }, 5000);
                }, 1500);
            });
            
            closeToastBtn.addEventListener('click', () => {
                successOverlay.classList.add('hidden');
            });
        });
    </script>
</body></html>
